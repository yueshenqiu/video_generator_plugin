# video_generator_plugin - 视频生成插件配置文件
# 支持多服务商的AI视频生成插件，提供文生视频、图生视频、首尾帧控制等功能

[plugin]
enabled = true                                 # 是否启用插件（true=启用，false=禁用）
config_version = "2.2.0"                       # 配置文件版本号，请勿手动修改

[admin]
admin_users = [""]                               # 管理员用户列表，填入用户ID，例如 ["12346", "789012"]

[generation]
default_model = "model1"                       # 默认使用的模型，可选值：model1, model2, model3, model4
default_resolution = "720p"                    # 默认分辨率，可选值：480p, 720p, 1080p, 4k
default_fps = 24                               # 默认帧率，可选值：15, 24, 30
default_duration = 5                           # 默认视频时长（秒），范围 1-60

[queue]
max_queue_size = 10                            # 最大任务队列长度，范围 1-100
task_timeout = 600                             # 单个任务的最大等待时间（秒），范围 60-3600
poll_interval = 5                              # 轮询任务状态的基础间隔（秒），范围 1-60
auto_cleanup = true                            # 是否自动清理已完成的任务记录
cleanup_delay = 3600                           # 已完成任务的保留时间（秒），超时后自动清理

[templates]
enable_templates = true                        # 是否启用预设模板功能（true=启用，false=禁用）

[[templates.template_list]]
keyword = "日落"                                # 模板触发关键词，用户在命令中输入该词即可匹配
description = "唯美日落场景"                     # 模板的简要描述
prompt = "金色的夕阳缓缓落入海平面，天空呈现出橙红色的渐变，海面波光粼粼" # 实际发送给模型的视频生成提示词
resolution = "1080p"                           # 该模板使用的分辨率
fps = 24                                       # 该模板使用的帧率
duration = 5                                   # 该模板使用的视频时长（秒）

[[templates.template_list]]
keyword = "星空"                                # 模板触发关键词
description = "璀璨星空延时"                     # 模板的简要描述
prompt = "深邃的夜空中繁星闪烁，银河横跨天际，流星划过" # 实际发送给模型的视频生成提示词
resolution = "1080p"                           # 该模板使用的分辨率
fps = 24                                       # 该模板使用的帧率
duration = 5                                   # 该模板使用的视频时长（秒）

[models]
hint = "支持的服务商：volcengine（火山引擎）、aliyun（阿里云）、zhipu（智谱）、openai（OpenAI兼容）、kling（可灵）" # 服务商配置说明（仅提示用）

[models.model1]
name = "豆包视频生成"                            # 模型显示名称
format = "volcengine"                          # 服务商类型：volcengine=火山引擎, aliyun=阿里云, zhipu=智谱, openai=OpenAI兼容, kling=可灵
base_url = "https://ark.cn-beijing.volces.com/api/v3" # API 基础请求地址
api_key = ""                                   # API 密钥，支持 ${ENV_VAR} 格式从环境变量读取
model = "doubao-seedance-1-5-pro-251215"       # 模型标识符，对应服务商的模型 ID
default_resolution = "720p"                    # 该模型默认分辨率
default_duration = 5                           # 该模型默认视频时长（秒）
prompt_extend = true                           # 是否启用提示词自动扩展优化
watermark = false                              # 是否添加服务商水印
support_img2video = true                       # 是否支持图生视频功能

[models.model2]
name = "通义万相视频"                            # 模型显示名称
format = "aliyun"                              # 服务商类型：阿里云
base_url = "https://dashscope.aliyuncs.com/api/v1" # API 基础请求地址
api_key = ""                                   # API 密钥，支持 ${ENV_VAR} 格式从环境变量读取
model = "wan2.5-i2v-plus"                     # 模型标识符
default_resolution = "720p"                    # 该模型默认分辨率
default_duration = 5                           # 该模型默认视频时长（秒）
prompt_extend = true                           # 是否启用提示词自动扩展优化
watermark = false                              # 是否添加服务商水印
support_img2video = true                       # 是否支持图生视频功能

[models.model3]
name = "智谱CogVideoX"                          # 模型显示名称
format = "zhipu"                               # 服务商类型：智谱
base_url = "https://open.bigmodel.cn/api"      # API 基础请求地址
api_key = ""                                   # API 密钥，支持 ${ENV_VAR} 格式从环境变量读取
model = "cogvideox-3"                          # 模型标识符
default_resolution = "1080p"                   # 该模型默认分辨率
default_duration = 5                           # 该模型默认视频时长（秒）
prompt_extend = true                           # 是否启用提示词自动扩展优化
watermark = false                              # 是否添加服务商水印
support_img2video = true                       # 是否支持图生视频功能

[models.model4]
name = "可灵视频生成"                            # 模型显示名称
format = "kling"                               # 服务商类型：可灵
base_url = "https://api-beijing.klingai.com"   # API 基础请求地址
api_key = ""                                   # API 密钥，支持 ${ENV_VAR} 格式从环境变量读取
model = "kling-v1-6"                           # 模型标识符
default_resolution = "720p"                    # 该模型默认分辨率
default_duration = 5                           # 该模型默认视频时长（秒）
prompt_extend = true                           # 是否启用提示词自动扩展优化
watermark = false                              # 是否添加服务商水印
support_img2video = true                       # 是否支持图生视频功能
